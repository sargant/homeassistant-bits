# Dishwasher cycle detector — v4.3.0
#
# This package infers a dishwasher cycle from the power and cumulative-energy
# sensors exposed by the dishwasher's smart plug. It deliberately keeps the
# detection logic in YAML so every part remains visible and inspectable in
# Home Assistant.
#
# v4.2 moved historical timestamps, duration and energy into attributes on the
# cycle-state sensor to reduce UI clutter. v4.2.1 restored thin public running
# and phase entities for useful time-series history.
#
# v4.3 simplifies end detection. The previous Ending -> Finish pending sequence
# assumed a final >5 W burst after a long low-power period. That fitted the
# observed drying cycles but could strand a programme that simply goes quiet.
# The two states are now one End armed state:
#
#   - seven continuous minutes below 30 W arms the end;
#   - once armed, one continuous minute below 5 W finishes the cycle;
#   - any return above 30 W proves the dishwasher is still active and returns
#     the detector to Running.
#
# Installation / search-and-replace
# ---------------------------------
# This package has three installation-specific source entities. Before using it
# elsewhere, search and replace each complete entity ID throughout this file:
#
# Instantaneous power (W):
#   sensor.kitchen_dishwasher_socket_power
#
# Cumulative energy usage (kWh):
#   sensor.kitchen_dishwasher_socket_energy
#
# Current electricity unit rate (GBP/kWh):
#   sensor.octopus_energy_electricity_15p0128357_1640000213346_current_rate
#
# Notifications use the modern notify.send_message action and target every
# notify entity carrying the Home Assistant label with ID `Receive push notifications`.
#
# State-machine overview
# ----------------------
# Idle -> Starting -> Running -> End armed -> Finished -> Idle
#
# Idle
#   No cycle is believed to be in progress. A rise above 5 W creates a possible
#   start and moves the detector to Starting.
#
# Starting
#   The >5 W activity may merely be a brief wake-up. A six-minute confirmation
#   window is opened. Reaching >30 W during that window confirms a real cycle
#   and moves to Running. If confirmation never arrives, the detector returns
#   to Idle.
#
# Running
#   Every fall below 30 W opens a seven-minute end window. Any return above
#   30 W cancels that window. Remaining below 30 W for the full seven minutes
#   moves to End armed.
#
# End armed
#   The low-power period has lasted long enough that the cycle is allowed to
#   finish. Power must remain below 5 W for one minute before Finished is
#   declared. A rise above 5 W cancels only that one-minute finish confirmation;
#   a rise above 30 W proves the cycle is still properly active and returns to
#   Running.
#
# Finished
#   The finish timestamp, duration and energy are captured. The detector stays
#   Finished until the appliance has been below 1 W for 60 seconds, then returns
#   to Idle ready for the next cycle.
#
# Threshold summary
# -----------------
# >5 W             candidate activity / cancels pending finish
# >30 W            confirms or re-confirms active washing
# 6 minutes        maximum time for a candidate start to reach >30 W
# 7 minutes <30 W  arms the end
# 60 seconds <5 W  confirms the finish once armed
# 60 seconds <1 W  confirms the appliance has gone fully idle


# -----------------------------------------------------------------------------
# TIMERS
# -----------------------------------------------------------------------------
timer:
  dishwasher_start_confirm:
    name: Dishwasher start confirmation
    duration: "00:06:00"
    restore: true

  dishwasher_end_window:
    name: Dishwasher end window
    duration: "00:07:00"
    restore: true

  dishwasher_finish_confirm:
    name: Dishwasher finish confirmation
    duration: "00:01:00"
    restore: true


# -----------------------------------------------------------------------------
# TEMPLATE ENTITIES
# -----------------------------------------------------------------------------
template:
  - triggers:
      - trigger: numeric_state
        entity_id: sensor.kitchen_dishwasher_socket_power
        above: 5
        id: above_5

      - trigger: numeric_state
        entity_id: sensor.kitchen_dishwasher_socket_power
        below: 5
        id: below_5

      - trigger: numeric_state
        entity_id: sensor.kitchen_dishwasher_socket_power
        above: 30
        id: above_30

      - trigger: numeric_state
        entity_id: sensor.kitchen_dishwasher_socket_power
        below: 30
        id: below_30

      - trigger: numeric_state
        entity_id: sensor.kitchen_dishwasher_socket_power
        below: 1
        for: "00:01:00"
        id: asleep

      - trigger: timer.finished
        target:
          entity_id: timer.dishwasher_start_confirm
        id: start_timeout

      - trigger: timer.finished
        target:
          entity_id: timer.dishwasher_end_window
        id: end_timeout

      - trigger: timer.finished
        target:
          entity_id: timer.dishwasher_finish_confirm
        id: finish_timeout

      - trigger: homeassistant
        event: start
        id: startup

      - trigger: event
        event_type: event_template_reloaded
        id: startup

    actions:
      - variables:
          s: >-
            {% set previous = states('sensor.kitchen_dishwasher_cycle_state') %}
            {{ previous if previous in
               ['Idle', 'Starting', 'Running', 'End armed', 'Finished']
               else 'Idle' }}

          p: "{{ states('sensor.kitchen_dishwasher_socket_power') | float(0) }}"

          next_state: >-
            {% if trigger.id == 'above_5' and s == 'Idle' %}
              Starting
            {% elif trigger.id == 'above_30' and s == 'Starting'
                    and is_state('timer.dishwasher_start_confirm', 'active') %}
              Running
            {% elif trigger.id in ['start_timeout', 'asleep'] and s == 'Starting' %}
              Idle
            {% elif trigger.id == 'above_30' and s in ['Running', 'End armed'] %}
              Running
            {% elif trigger.id == 'end_timeout' and s == 'Running' and p < 30 %}
              End armed
            {% elif trigger.id == 'finish_timeout' and s == 'End armed' and p < 5 %}
              Finished
            {% elif trigger.id == 'asleep' and s == 'Finished' %}
              Idle
            {% elif trigger.id == 'startup' and s == 'Starting' and p > 30 %}
              Running
            {% elif trigger.id == 'startup' and s == 'Starting'
                    and is_state('timer.dishwasher_start_confirm', 'idle') %}
              Idle
            {% elif trigger.id == 'startup' and s == 'End armed' and p > 30 %}
              Running
            {% elif trigger.id == 'startup' and s == 'Finished' and p < 1 %}
              Idle
            {% else %}
              {{ s }}
            {% endif %}

      # Idle -> Starting begins the six-minute candidate window.
      - if: "{{ trigger.id == 'above_5' and s == 'Idle' }}"
        then:
          - action: timer.start
            target:
              entity_id: timer.dishwasher_start_confirm

      # Leaving Starting makes its confirmation timer obsolete.
      - if: >-
          {{ s == 'Starting' and (next_state | trim) != 'Starting'
             and is_state('timer.dishwasher_start_confirm', 'active') }}
        then:
          - action: timer.cancel
            target:
              entity_id: timer.dishwasher_start_confirm

      # Every Running drop below 30 W starts a fresh seven-minute end window.
      - if: "{{ trigger.id == 'below_30' and s == 'Running' }}"
        then:
          - action: timer.start
            target:
              entity_id: timer.dishwasher_end_window

      # Returning above 30 W cancels any pending end/finish confirmation.
      - if: >-
          {{ trigger.id == 'above_30' and s in ['Running', 'End armed'] }}
        then:
          - action: timer.cancel
            target:
              entity_id:
                - timer.dishwasher_end_window
                - timer.dishwasher_finish_confirm

      # Once End armed, activity above 5 W cancels the quiet-minute confirmation.
      - if: "{{ trigger.id == 'above_5' and s == 'End armed' }}"
        then:
          - action: timer.cancel
            target:
              entity_id: timer.dishwasher_finish_confirm

      # If the end window expires while already below 5 W, start the quiet
      # minute immediately; no later >5 W burst is required.
      - if: >-
          {{ trigger.id == 'end_timeout' and s == 'Running' and p < 5 }}
        then:
          - action: timer.start
            target:
              entity_id: timer.dishwasher_finish_confirm

      - if: "{{ trigger.id == 'below_5' and s == 'End armed' }}"
        then:
          - action: timer.start
            target:
              entity_id: timer.dishwasher_finish_confirm

      # Recreate required windows after startup if restored timers are idle.
      - if: >-
          {{ trigger.id == 'startup' and s == 'Running' and p < 30
             and is_state('timer.dishwasher_end_window', 'idle') }}
        then:
          - action: timer.start
            target:
              entity_id: timer.dishwasher_end_window

      - if: >-
          {{ trigger.id == 'startup' and s == 'End armed' and p < 5
             and is_state('timer.dishwasher_finish_confirm', 'idle') }}
        then:
          - action: timer.start
            target:
              entity_id: timer.dishwasher_finish_confirm

    sensor:
      - name: Dishwasher cycle state
        unique_id: dishwasher_cycle_state
        default_entity_id: sensor.kitchen_dishwasher_cycle_state
        icon: mdi:dishwasher
        state: "{{ next_state | trim }}"
        attributes:
          candidate_started_at: >-
            {% if s == 'Idle' and next_state | trim == 'Starting' %}
              {{ now().isoformat() }}
            {% else %}
              {{ this.attributes.get('candidate_started_at') }}
            {% endif %}

          candidate_start_energy_kwh: >-
            {% if s == 'Idle' and next_state | trim == 'Starting' %}
              {{ states('sensor.kitchen_dishwasher_socket_energy') | float(0) }}
            {% else %}
              {{ this.attributes.get('candidate_start_energy_kwh') }}
            {% endif %}

          last_started_at: >-
            {% if s == 'Starting' and next_state | trim == 'Running' %}
              {{ this.attributes.get('candidate_started_at') }}
            {% else %}
              {{ this.attributes.get('last_started_at') }}
            {% endif %}

          last_started_energy_kwh: >-
            {% if s == 'Starting' and next_state | trim == 'Running' %}
              {{ this.attributes.get('candidate_start_energy_kwh') }}
            {% else %}
              {{ this.attributes.get('last_started_energy_kwh') }}
            {% endif %}

          last_finished_at: >-
            {% if s == 'End armed' and next_state | trim == 'Finished' %}
              {{ as_datetime(as_timestamp(now()) - 60).isoformat() }}
            {% else %}
              {{ this.attributes.get('last_finished_at') }}
            {% endif %}

          last_duration_s: >-
            {% if s == 'End armed' and next_state | trim == 'Finished' %}
              {% set started = this.attributes.get('last_started_at') %}
              {% if started %}
                {{ (((as_timestamp(now()) - 60) - as_timestamp(started)) | round(0)) }}
              {% else %}
                {{ this.attributes.get('last_duration_s') }}
              {% endif %}
            {% else %}
              {{ this.attributes.get('last_duration_s') }}
            {% endif %}

          last_cycle_energy_kwh: >-
            {% if s == 'End armed' and next_state | trim == 'Finished' %}
              {% set start_energy = this.attributes.get('last_started_energy_kwh') %}
              {% if start_energy is not none %}
                {{ ((states('sensor.kitchen_dishwasher_socket_energy') | float(0))
                    - (start_energy | float(0))) | round(3) }}
              {% else %}
                {{ this.attributes.get('last_cycle_energy_kwh') }}
              {% endif %}
            {% else %}
              {{ this.attributes.get('last_cycle_energy_kwh') }}
            {% endif %}

  - binary_sensor:
      - name: Dishwasher running
        unique_id: dishwasher_running
        default_entity_id: binary_sensor.kitchen_dishwasher_running
        device_class: running
        state: >-
          {{ states('sensor.kitchen_dishwasher_cycle_state')
             in ['Starting', 'Running', 'End armed'] }}

  - sensor:
      - name: Dishwasher phase
        unique_id: dishwasher_phase
        default_entity_id: sensor.kitchen_dishwasher_phase
        icon: mdi:dishwasher
        state: >-
          {% set cycle = states('sensor.kitchen_dishwasher_cycle_state') %}
          {% if cycle in ['Idle', 'Finished'] %}
            {{ cycle }}
          {% elif cycle in ['Starting', 'Running', 'End armed'] %}
            Running
          {% else %}
            {{ cycle }}
          {% endif %}


# -----------------------------------------------------------------------------
# NOTIFICATIONS
# -----------------------------------------------------------------------------
automation:
  - id: dishwasher_started_notification
    alias: Dishwasher started notification
    description: Notify labelled push targets when a dishwasher cycle starts.
    triggers:
      - trigger: state
        entity_id: sensor.kitchen_dishwasher_cycle_state
        from: "Starting"
        to: "Running"
    actions:
      - action: notify.send_message
        target:
          label_id: "{{ label_id('Receive push notifications') }}"
        data:
          title: 🍽️ Dishwasher started
          message: >-
            Started at {{
              as_timestamp(trigger.to_state.attributes.get('last_started_at'))
              | timestamp_custom('%H:%M')
            }}

  - id: dishwasher_finished_notification
    alias: Dishwasher finished notification
    description: Notify labelled push targets when a dishwasher cycle finishes.
    triggers:
      - trigger: state
        entity_id: sensor.kitchen_dishwasher_cycle_state
        from: "End armed"
        to: "Finished"
    actions:
      - action: notify.send_message
        target:
          label_id: "{{ label_id('Receive push notifications') }}"
        data:
          title: 🍽️ Dishwasher finished
          message: >-
            {% set duration_s = trigger.to_state.attributes.get('last_duration_s') | int(0) %}
            {% set total_minutes = duration_s // 60 %}
            {% set hours = total_minutes // 60 %}
            {% set minutes = total_minutes % 60 %}
            {% set duration = (hours ~ 'h' if hours > 0 else '') ~ minutes ~ 'm' %}
            {% set energy = trigger.to_state.attributes.get('last_cycle_energy_kwh') | float(0) %}
            {% set rate = states('sensor.octopus_energy_electricity_15p0128357_1640000213346_current_rate') %}
            {% set cost = energy * (rate | float(0)) if is_number(rate) else none %}
            {{ duration }} • {{ '%.2f' | format(energy) }}kWh • {{ ('£%.2f' | format(cost)) if cost is not none else 'cost unavailable' }}

# UI footprint
# ------------
# The package keeps bookkeeping in attributes while exposing only useful states:
#
#   sensor.kitchen_dishwasher_cycle_state    detailed detector lifecycle
#   binary_sensor.kitchen_dishwasher_running running / not-running
#   sensor.kitchen_dishwasher_phase          Idle / Running / Finished
#   timer.dishwasher_start_confirm
#   timer.dishwasher_end_window
#   timer.dishwasher_finish_confirm
#
# Last-start, last-finish, duration and cycle-energy values remain attributes of
# the cycle-state sensor.
